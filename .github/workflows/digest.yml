name: Task Digest
# GitHub's own schedule trigger can be unreliable; an external cron service
# POSTing a repository_dispatch is a sturdier clock. Manual runs always work.
"on":
  repository_dispatch:
    types: [digest]
  workflow_dispatch:
  schedule:
    - cron: "45 12 * * 1-5"

jobs:
  digest:
    runs-on: ubuntu-latest
    permissions:
      contents: write      # commit the snapshot back so tomorrow can diff against it
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - name: Send digest
        env:
          LARK_APP_ID: ${{ secrets.LARK_APP_ID }}
          LARK_APP_SECRET: ${{ secrets.LARK_APP_SECRET }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DIGEST_WEBHOOK_URL: ${{ secrets.DIGEST_WEBHOOK_URL }}
          DIGEST_TIMEZONE: ${{ vars.DIGEST_TIMEZONE }}
        run: python3 digest.py --source lark --webhook
      - name: Persist snapshot
        run: |
          git add -f state/
          git diff --cached --quiet && exit 0
          git config user.name "digest-bot" && git config user.email "actions@github.com"
          git commit -m "snapshot $(date -u +%F)" && git push
